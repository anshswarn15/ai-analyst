services:
  - type: web
    runtime: docker
    name: datapilot-ai-analyst
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: MAX_AGENT_STEPS
        value: "2"
      - key: AUTH_ENABLED
        value: "true"
      - key: ALLOW_SIGNUP
        value: "false"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: SESSION_TTL_MINUTES
        value: "120"
      - key: GROQ_API_KEY
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
